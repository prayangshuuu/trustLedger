name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend, evals and quality gates
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy backend/app mcp_server workflows federated
      - name: Tests
        run: uv run pytest
      - name: Offline evals and gates (fails on fairness / quality regressions)
        run: uv run python evals/run_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            training_files/eval_report.json
            evals/EVAL_REPORT.md

  dashboard:
    name: Lender dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm test
      - run: npm run build

  mobile:
    name: Borrower app (Android + web codebase)
    # macOS: the golden screenshots are generated on macOS; same pinned Flutter as local
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
      - run: flutter pub get
      - name: Design tokens are up to date
        run: dart run tool/gen_tokens.dart --check
      - run: flutter analyze
      - name: Widget, router and golden tests
        run: flutter test
      - run: flutter build web --release --base-href /app/ --dart-define=API_BASE_URL=

  web-e2e:
    name: Web app in Chromium, Firefox and WebKit
    runs-on: ubuntu-latest
    needs: [backend]
    env:
      LLM_MODE: mock
      DEMO_MODE: "true"
      API_KEYS: dev-key
      DATABASE_URL: sqlite:///./ci.db
      SKIP_LIGHTHOUSE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.9
      - run: uv sync --frozen
      - name: Build borrower web app and dashboard
        run: |
          (cd apps/mobile && flutter pub get && flutter build web --release --base-href /app/ --dart-define=API_BASE_URL= --dart-define=API_KEY=dev-key)
          (cd apps/dashboard && npm ci && npm run build && npx playwright install --with-deps chromium firefox webkit)
      - name: Seed and start the API
        run: |
          uv run python backend/scripts/seed_demo.py --population 500
          uv run python -m app.rag.ingest
          uv run uvicorn app.main:app --port 8000 &
          sleep 10
      - name: Cross-browser check (Chromium, Firefox, WebKit desktop + iPhone, Android)
        run: node apps/mobile/tool/web_audit.mjs
      - name: Borrower web e2e (Moon flow, deep links, desktop, Bhorsha)
        run: node apps/mobile/tool/e2e_web_test.mjs
