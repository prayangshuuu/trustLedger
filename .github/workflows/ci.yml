name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend, evals and quality gates
    runs-on: ubuntu-latest
    env:
      LLM_MODE: mock
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy backend/app mcp_server workflows federated
      - name: Tests
        run: uv run pytest
      - name: Offline evals and gates (fails on fairness / quality regressions)
        run: uv run python evals/run_all.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            training_files/eval_report.json
            evals/EVAL_REPORT.md

  dashboard:
    name: Lender dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm test
      - run: npm run build

  mobile:
    name: Borrower app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
