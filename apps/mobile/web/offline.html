<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ট্রাস্টলেজার — অফলাইন</title>
  <meta name="theme-color" content="#0F172A">
  <style>
    :root {
      --navy: #0F172A;
      --teal: #14B8A6;
      --teal-dark: #0F766E;
      --surface: #1E293B;
      --text: #F8FAFC;
      --muted: #94A3B8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--navy);
      color: var(--text);
      font-family: "Hind Siliguri", system-ui, -apple-system, sans-serif;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: var(--surface);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(20, 184, 166, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--teal);
    }
    .icon-wrap svg {
      width: 36px;
      height: 36px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
    }
    p {
      margin: 0;
      font-size: 15px;
      line-height: 1.5;
      color: var(--muted);
    }
    .en {
      font-size: 13px;
      color: #64748B;
      margin-top: 4px;
    }
    .btn {
      margin-top: 8px;
      background: var(--teal);
      color: #FFFFFF;
      border: 0;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }
    .btn:hover, .btn:focus {
      background: var(--teal-dark);
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="card" role="main">
    <div class="icon-wrap" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>আপনার ডিভাইসটি বর্তমানে অফলাইনে আছে। অনুগ্রহ করে ইন্টারনেট সংযোগ পরীক্ষা করে পুনরায় চেষ্টা করুন।</p>
    <p class="en">You are currently offline. Please check your internet connection and try again.</p>
    <button class="btn" onclick="window.location.reload()">পুনরায় চেষ্টা করুন (Retry)</button>
  </div>
</body>
</html>
