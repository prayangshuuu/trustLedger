h="163.79999999999998" height="4" rx="0" fill="#14B8A6"/></g><text x="195.0" y="128" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#475569" text-anchor="middle">Question 5 of 12</text><g id="bubble/bot"><rect x="16" y="144" width="268" height="111.0" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="30" y="170.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">You have no wallet history, so</text><text x="30" y="191.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">I will ask a few simple</text><text x="30" y="212.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">questions. Answer from your</text><text x="30" y="233.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">own life.</text></g><g id="bubble/bot"><rect x="16" y="267.0" width="268" height="90.0" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="30" y="293.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">If a neighbour lent you ৳</text><text x="30" y="314.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">2,000, how would you plan to</text><text x="30" y="335.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">pay it back?</text></g><g id="bubble/user"><rect x="124" y="369.0" width="250" height="90.0" rx="18" fill="#0F766E"/><text x="138" y="395.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#fff" text-anchor="start">I would give ৳ 500 every</text><text x="138" y="416.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#fff" text-anchor="start">Friday from my tailoring</text><text x="138" y="437.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#fff" text-anchor="start">income.</text></g><g id="bubble/bot"><rect x="16" y="471.0" width="268" height="90.0" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="30" y="497.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">Good plan. Has a samity or</text><text x="30" y="518.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">shop ever trusted you with</text><text x="30" y="539.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#0F172A" text-anchor="start">credit before?</text></g><g id="composer"><rect x="0" y="744" width="390" height="100" rx="0" fill="#FFFFFF"/><rect x="0" y="744" width="390" height="1" rx="0" fill="#E2E8F0"/><rect x="16" y="758" width="298" height="48" rx="24.0" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/><text x="36" y="788" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">Type your answer…</text><circle cx="348" cy="782" r="24" fill="#0F766E"/><path d="M338 772 L360 782 L338 792 L342 782 Z" fill="#fff"/><rect x="128.0" y="834" width="134" height="5" rx="2.5" fill="#0F172A"/></g></g></svg>
