<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><g id="frame/Mobile / 02 Consent"><rect id="background" x="0" y="0" width="390" height="844" rx="0" fill="#F8FAFC"/><g id="app-bar"><rect x="0" y="0" width="390" height="100" rx="0" fill="#0F172A"/><g id="status-bar"><text x="24" y="30" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="start">9:41</text><rect x="320" y="20" width="22" height="11" rx="3" fill="none" stroke="#fff" stroke-width="1.2"/><rect x="322" y="22" width="15" height="7" rx="1.5" fill="#fff"/><rect x="292" y="22" width="4" height="9" rx="1" fill="#fff"/><rect x="298" y="20" width="4" height="11" rx="1" fill="#fff"/><rect x="304" y="18" width="4" height="13" rx="1" fill="#fff"/></g><text x="16" y="82" font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#fff" text-anchor="start">Your consent</text><text x="370" y="82" font-family="Hind Siliguri, sans-serif" font-size="15" font-weight="500" fill="#fff" text-anchor="end">বাংলা</text></g><text x="16" y="136.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">You decide which data we may use. You can</text><text x="16" y="157.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="#475569" text-anchor="start">turn any of it off later in Settings.</text><g id="card/consent-1"><rect x="16" y="179" width="358" height="92" rx="12" fill="#0F172A" fill-opacity="0.06"/><rect x="16" y="178" width="358" height="92" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="32" y="208" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="start">Transaction SMS</text><text x="32" y="228.0" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Only totals from wallet SMS (income,</text><text x="32" y="246.2" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">bills, savings). Raw SMS is never</text><text x="32" y="264.4" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">stored.</text><g id="switch/on"><rect x="306" y="208.0" width="52" height="32" rx="16" fill="#0F766E"/><circle cx="342" cy="224.0" r="12" fill="#fff"/></g></g><g id="card/consent-2"><rect x="16" y="281" width="358" height="72" rx="12" fill="#0F172A" fill-opacity="0.06"/><rect x="16" y="280" width="358" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="32" y="310" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="start">Utility bills</text><text x="32" y="330.0" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">To see if bills are paid on time.</text><g id="switch/on"><rect x="306" y="300.0" width="52" height="32" rx="16" fill="#0F766E"/><circle cx="342" cy="316.0" r="12" fill="#fff"/></g></g><g id="card/consent-3"><rect x="16" y="363" width="358" height="72" rx="12" fill="#0F172A" fill-opacity="0.06"/><rect x="16" y="362" width="358" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="32" y="392" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="start">Mobile recharge</text><text x="32" y="412.0" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">How regularly you recharge.</text><g id="switch/on"><rect x="306" y="382.0" width="52" height="32" rx="16" fill="#0F766E"/><circle cx="342" cy="398.0" r="12" fill="#fff"/></g></g><g id="card/consent-4"><rect x="16" y="445" width="358" height="92" rx="12" fill="#0F172A" fill-opacity="0.06"/><rect x="16" y="444" width="358" height="92" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="32" y="474" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="start">Bill photos (OCR)</text><text x="32" y="494.0" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Photos are encrypted and kept for at</text><text x="32" y="512.2" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">most 30 days.</text><g id="switch/off"><rect x="306" y="474.0" width="52" height="32" rx="16" fill="#CBD5E1"/><circle cx="322" cy="490.0" r="8" fill="#fff"/></g></g><g id="card/consent-5"><rect x="16" y="547" width="358" height="92" rx="12" fill="#0F172A" fill-opacity="0.06"/><rect x="16" y="546" width="358" height="92" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/><text x="32" y="576" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#0F172A" text-anchor="start">Bhorsha chat</text><text x="32" y="596.0" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">10-12 simple questions if you have</text><text x="32" y="614.2" font-family="Inter, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">no history.</text><g id="switch/on"><rect x="306" y="576.0" width="52" height="32" rx="16" fill="#0F766E"/><circle cx="342" cy="592.0" r="12" fill="#fff"/></g></g><g id="bottom-bar"><rect x="0" y="744" width="390" height="100" rx="0" fill="#F8FAFC"/><g id="button/filled"><rect x="16" y="758" width="358" height="52" rx="26.0" fill="#0F766E"/><text x="195.0" y="790.0" font-family="Inter, sans-serif" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Continue</text></g><rect x="128.0" y="834" width="134" height="5" rx="2.5" fill="#0F172A"/></g></g></svg>
