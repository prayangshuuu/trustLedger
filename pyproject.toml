[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustledger"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "notebook",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pgvector>=0.2.5",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.34",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/env.py" = ["E402"]
"backend/scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"

[[tool.mypy.overrides]]
module = "app.core.*"
strict = true

[[tool.mypy.overrides]]
module = [
    "xgboost",
    "xgboost.*",
    "shap",
    "shap.*",
    "sklearn.*",
    "pandas",
    "pandas.*",
    "presidio_analyzer",
    "presidio_analyzer.*",
    "presidio_anonymizer",
    "presidio_anonymizer.*",
    "yaml",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-v --cov=app --cov-report=term-missing"
