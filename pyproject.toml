[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trustledger"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "boto3>=1.44.7",
    "cryptography>=50.0.2",
    "fastapi>=0.111.0",
    "flwr>=1.44.0",
    "httpx>=0.27.0",
    "langgraph>=1.2.24",
    "mcp>=1.20,<2",
    "numpy>=2.5.5",
    "pandas>=3.1.1",
    "pgvector>=0.2.5",
    "pillow>=13.0.0",
    "presidio-analyzer>=2.2.0",
    "presidio-anonymizer>=2.2.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=7.1.1",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "spacy>=3.8.18",
    "sqlalchemy>=2.0.0",
    "temporalio>=1.36.1",
    "uvicorn>=0.30.0",
    "xgboost>=3.4.1",
]

[project.optional-dependencies]
# Real BGE-M3 embeddings, BGE reranker and LLMLingua (large model downloads)
rag-live = ["sentence-transformers>=3.0.0", "llmlingua>=0.2.2"]

[dependency-groups]
# Training notebook and plots (not needed by the API)
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "notebook",
]
dev = [
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[tool.uv]
default-groups = ["dev", "notebook"]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/env.py" = ["E402"]
"backend/scripts/*" = ["E402"]
"evals/**" = ["E402"]
"federated/**" = ["E402"]
"workflows/**" = ["E402"]
"mcp_server/**" = ["E402"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"

[[tool.mypy.overrides]]
module = "app.core.*"
strict = true

[[tool.mypy.overrides]]
module = [
    "xgboost",
    "xgboost.*",
    "shap",
    "shap.*",
    "sklearn.*",
    "pandas",
    "pandas.*",
    "presidio_analyzer",
    "presidio_analyzer.*",
    "presidio_anonymizer",
    "presidio_anonymizer.*",
    "yaml",
    "yaml.*",
    "boto3",
    "boto3.*",
    "botocore.*",
    "flwr",
    "flwr.*",
    "pgvector.*",
    "sentence_transformers",
    "sentence_transformers.*",
    "llmlingua",
    "llmlingua.*",
    "airflow",
    "airflow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
addopts = "-v --cov=app --cov-report=term-missing"
